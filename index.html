<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Absensi Sales Lapangan</title>
<style>
  :root{
    --bg:#F7F5F1; --surface:#FFFFFF; --primary:#1B3A34; --primary-dark:#142B27;
    --accent:#E08D3C; --accent-dark:#CB7B2E; --success:#4A7C59; --success-bg:#4A7C5920;
    --danger:#C1502E; --danger-bg:#C1502E20; --border:#E4E0D8; --muted:#8C8676; --text:#21201C;
    --chip-bg:#EFEBE2;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  .display{font-weight:700;}
  input,select,textarea,button{font-family:inherit;font-size:14px;}
  button{cursor:pointer;}
  .screen{min-height:100vh;}
  .header{background:var(--primary);padding:24px 20px 32px;border-radius:0 0 28px 28px;color:#fff;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;}
  .card2{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
  .btn{border:none;border-radius:12px;padding:12px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-accent:disabled{opacity:.45;}
  .btn-dark{background:var(--primary);color:#fff;}
  .btn-outline{background:#fff;border:1px solid var(--border);color:var(--muted);}
  .btn-ghost{background:rgba(255,255,255,.1);color:#fff;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-sm{padding:8px 12px;font-size:12px;border-radius:10px;}
  .input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:#fff;font-size:14px;}
  .input:focus{outline:2px solid #1B3A3440;border-color:var(--primary);}
  .input-dark{border:none;background:rgba(255,255,255,.95);}
  label.lbl{display:block;font-size:12px;font-weight:500;color:#5B564C;margin-bottom:6px;}
  .badge{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;}
  .badge-active{background:#E08D3C26;color:#B8681F;border:1px solid #E08D3C66;}
  .badge-done{background:var(--success-bg);color:#2F5B3B;border:1px solid #4A7C5950;}
  .badge-warn{background:var(--danger-bg);color:var(--danger);border:1px solid #C1502E55;}
  .badge-neutral{background:var(--chip-bg);color:#5B564C;}
  .chip{padding:7px 13px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid var(--border);background:#fff;color:#5B564C;}
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .row{display:flex;align-items:center;}
  .between{justify-content:space-between;}
  .gap8{gap:8px;} .gap6{gap:6px;} .gap4{gap:4px;} .gap12{gap:12px;}
  .stack{display:flex;flex-direction:column;}
  .p20{padding:0 20px;} .mt-4{margin-top:-16px;}
  .muted{color:var(--muted);}
  .small{font-size:12px;}
  .xs{font-size:11px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  a{color:var(--primary);}
  .spin{animation:spin 1s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:24px;text-align:center;}
  .timer{font-size:30px;font-weight:700;color:#fff;}
  .icon{width:15px;height:15px;display:inline-block;vertical-align:-2px;}
  .dot{width:8px;height:8px;border-radius:999px;flex-shrink:0;}
  .tabs{display:inline-flex;gap:4px;background:#fff;padding:4px;border-radius:999px;border:1px solid var(--border);}
  .tabs.dark{background:rgba(255,255,255,.1);border:none;}
  .tab-btn{padding:7px 14px;border:none;background:transparent;border-radius:999px;font-size:12px;font-weight:500;color:#5B564C;}
  .tab-btn.active{background:var(--primary);color:#fff;}
  .tabs.dark .tab-btn{color:rgba(255,255,255,.7);}
  .tabs.dark .tab-btn.active{background:#fff;color:var(--primary);}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal-sheet{background:var(--bg);width:100%;max-width:480px;border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;}
  .sticky-top{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);padding:16px 20px;}
  .sticky-bottom{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);padding:14px 16px;display:flex;gap:8px;}
  .link{color:var(--primary);text-decoration:underline;font-size:12px;}
  .divider{height:1px;background:#EFEBE2;}
  .timeline{position:relative;padding-left:20px;}
  .timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:1px;background:var(--border);}
  .timeline-dot{position:absolute;left:-20px;top:4px;width:14px;height:14px;border-radius:999px;border:2px solid var(--bg);}
</style>
</head>

function withTimeout(p, ms){ ms = ms || 15000;
  return Promise.race([p, new Promise(function(_,rej){ setTimeout(function(){ rej(new Error('Waktu tunggu server habis')); }, ms); })]);
}
function apiGet(key){
  var bust = Date.now()+'-'+Math.random().toString(36).slice(2,8);
  return fetch('/api/kv?key='+encodeURIComponent(key)+'&_='+bust, {cache:'no-store'}).then(function(res){
    if(res.status===404) return null;
    if(!res.ok) throw new Error('Gagal memuat data dari server (status '+res.status+')');
    return res.json().then(function(data){ return data.value; });
  });
}
function apiSet(key, value){
  return fetch('/api/kv?key='+encodeURIComponent(key), {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({value:value})
  }).then(function(res){
    if(!res.ok) throw new Error('Gagal menyimpan data ke server (status '+res.status+')');
    return res.json();
  });
}

function loadVisits(){
  var bust = Date.now()+'-'+Math.random().toString(36).slice(2,8);
  return withTimeout(fetch('/api/visits?_='+bust, {cache:'no-store'}).then(function(res){
    if(!res.ok) throw new Error('Gagal memuat data kunjungan (status '+res.status+')');
    return res.json();
  })).then(function(data){ return data.visits || []; });
}
function upsertVisit(visit){
  return withTimeout(fetch('/api/visits', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({visit:visit})
  }).then(function(res){
    if(!res.ok) throw new Error('Gagal menyimpan kunjungan (status '+res.status+')');
    return res.json();
  })).catch(function(e){ console.error('gagal simpan visit', e); throw e; });
}
function clearAllVisits(){
  return withTimeout(fetch('/api/visits', {method:'DELETE'}).then(function(res){
    if(!res.ok) throw new Error('Gagal menghapus data kunjungan (status '+res.status+')');
    return res.json();
  })).catch(function(e){ console.error('gagal hapus visits', e); throw e; });
}
function loadStores(){
  return withTimeout(apiGet(STORES_KEY)).then(function(v){ return v || {}; }).catch(function(e){
    return new Promise(function(resolve){ setTimeout(resolve, 1500); }).then(function(){
      return withTimeout(apiGet(STORES_KEY)).then(function(v){ return v || {}; });
    }).catch(function(e2){
      reportClientError('loadStores', e2);
      return {};
    });
  });
}
function saveStores(s){ return withTimeout(apiSet(STORES_KEY, s)).catch(function(e){ console.error('gagal simpan stores', e); throw e; }); }
function loadDismissedDupes(){
  return withTimeout(apiGet(DISMISSED_DUPES_KEY)).then(function(v){ return v || {}; }).catch(function(){ return {}; });
}
function saveDismissedDupes(d){ return withTimeout(apiSet(DISMISSED_DUPES_KEY, d)).catch(function(e){ console.error('gagal simpan dismissed dupes', e); throw e; }); }
function dupePairKey(keyA, keyB){ return [keyA, keyB].sort().join('|'); }
function mergeStoreNames(keepKey, dropKey){
  return Promise.all([loadVisits(), loadStores()]).then(function(res){
    var freshVisits = res[0], freshStores = res[1];
    var keepStore = freshStores[keepKey], dropStore = freshStores[dropKey];
    if(!keepStore || !dropStore) throw new Error('Data toko sudah berubah, muat ulang halaman.');
    var keepName = keepStore.name, dropName = dropStore.name;
    var toMove = freshVisits.filter(function(v){ return v.storeName===dropName; });
    return Promise.all(toMove.map(function(v){
      return upsertVisit(Object.assign({}, v, {storeName:keepName}));
    })).then(function(){
      var updatedStores = Object.assign({}, freshStores);
      delete updatedStores[dropKey];
      return saveStores(updatedStores).then(function(){
        var updatedVisits = freshVisits.map(function(v){
          return v.storeName===dropName ? Object.assign({}, v, {storeName:keepName}) : v;
        });
        return {stores:updatedStores, visits:updatedVisits, keepName:keepName, movedCount:toMove.length};
      });
    });
  });
}
function computeSuspectedDuplicates(stores, dismissed){
  var keys = Object.keys(stores);
  var pairs = [];
  for(var i=0;i<keys.length;i++){
    for(var j=i+1;j<keys.length;j++){
      var a = stores[keys[i]], b = stores[keys[j]];
      if(a.lat==null || a.lng==null || b.lat==null || b.lng==null) continue;
      var pairKey = dupePairKey(keys[i], keys[j]);
      if(dismissed && dismissed[pairKey]) continue;
      var dist = haversineMeters(a.lat, a.lng, b.lat, b.lng);
      if(dist <= DUPLICATE_DISTANCE_THRESHOLD){
        pairs.push({keyA:keys[i], keyB:keys[j], pairKey:pairKey, a:a, b:b, dist:Math.round(dist), identical: dist<=IDENTICAL_DISTANCE_THRESHOLD});
      }
    }
  }
  pairs.sort(function(x,y){ return x.dist - y.dist; });
  return pairs;
}
function computeSuspiciousReps(stores){
  var byCreator = {};
  Object.keys(stores).forEach(function(k){
    var s = stores[k];
    if(s.lat==null || s.lng==null) return;
    var c = s.createdBy || '-';
    (byCreator[c] = byCreator[c] || []).push(s);
  });
  var result = [];
  Object.keys(byCreator).forEach(function(creator){
    var list = byCreator[creator];
    if(list.length < 5) return;
    var uniq = {};
    list.forEach(function(s){ uniq[s.lat.toFixed(5)+','+s.lng.toFixed(5)] = true; });
    var uniqueCount = Object.keys(uniq).length;
    var ratio = uniqueCount / list.length;
    if(ratio < 0.7){
      result.push({creator:creator, total:list.length, uniqueCount:uniqueCount, ratio:ratio});
    }
  });
  result.sort(function(a,b){ return a.ratio - b.ratio; });
  return result;
}

function startOfWeek(base){ var d=new Date(base); var day=d.getDay(); var diff=d.getDate()-day+(day===0?-6:1); d.setDate(diff); d.setHours(0,0,0,0); return d; }
function isInRange(iso, filter, s, e){
  var d=new Date(iso);
  if(filter==='today') return isToday(iso);
  if(filter==='week') return d>=startOfWeek(new Date());
  if(filter==='month'){ var now=new Date(); return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth(); }
  if(filter==='all') return true;
  if(filter==='custom'){ if(!s||!e) return true; return d>=new Date(s+'T00:00:00') && d<=new Date(e+'T23:59:59'); }

}

function haversineMeters(lat1,lng1,lat2,lng2){
  var R=6371000; function toRad(d){ return d*Math.PI/180; }
  var dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function getPosition(){
  function attempt(opts){
    return new Promise(function(resolve, reject){
      if(!navigator.geolocation){ reject({code:0, message:'Perangkat/browser ini tidak mendukung GPS.'}); return; }
      navigator.geolocation.getCurrentPosition(
        function(p){ resolve({lat:p.coords.latitude, lng:p.coords.longitude, accuracy:p.coords.accuracy}); },
        function(err){ reject(err); },
        opts
      );
    });
  }
  function toFriendly(err){
    if(err.code === 1){ // PERMISSION_DENIED
      return 'Izin lokasi ditolak/belum diaktifkan. Cara mengaktifkan: ketuk ikon 🔒 atau (i) di sebelah alamat website di atas → cari "Lokasi"/"Location" → pilih "Izinkan"/"Allow". Setelah itu coba Check-in lagi.';
    } else if(err.code === 2){ // POSITION_UNAVAILABLE
      return 'Lokasi GPS tidak dapat dideteksi. Pastikan GPS di HP menyala dan coba lagi di tempat yang lebih terbuka.';
    } else if(err.code === 3){ // TIMEOUT
      return 'Sinyal GPS lemah (sering terjadi di dalam ruangan). Sudah dicoba beberapa kali, tetap gagal. Coba pindah lebih dekat jendela/pintu, atau coba lagi sesaat lagi.';
    }
    return 'Gagal mengambil lokasi (' + (err.message || 'kesalahan tidak diketahui') + '). Coba lagi.';
  }
  // First attempt: high accuracy (best for radius check), generous timeout for weak indoor GPS signal.
  return attempt({enableHighAccuracy:true, timeout:18000, maximumAge:0}).catch(function(err){
    if(err.code === 1) return Promise.reject(err); // permission denied: no point retrying
    // Fallback: allow a recent cached fix or network/WiFi-based positioning, which resolves much faster indoors.
    return attempt({enableHighAccuracy:false, timeout:12000, maximumAge:60000}).catch(function(err2){
      return Promise.reject(err2);
    });
  }).then(function(pos){ return pos; }, function(err){ return {error: toFriendly(err)}; });
}

var EXIF_TYPE_SIZES = {1:1,2:1,3:2,4:4,5:8,7:1,9:4,10:8};
function readIfd(view, tiffStart, ifdOffset, little){
  var entries = [];
  if(ifdOffset+2 > view.byteLength) return entries;
  var count = view.getUint16(ifdOffset, little);
  for(var i=0;i<count;i++){
    var entryOffset = ifdOffset+2+i*12;
    if(entryOffset+12 > view.byteLength) break;
    var tag = view.getUint16(entryOffset, little);
    var type = view.getUint16(entryOffset+2, little);
    var numValues = view.getUint32(entryOffset+4, little);
    var valueOffset = entryOffset+8;
    var typeSize = EXIF_TYPE_SIZES[type] || 1;
    var totalSize = typeSize*numValues;
    var dataOffset = totalSize > 4 ? (tiffStart + view.getUint32(valueOffset, little)) : valueOffset;
    if(dataOffset+totalSize > view.byteLength) continue;
    var entry = {tag:tag};
    if(type === 2){
      var bytes = [];
      for(var j=0;j<Math.max(numValues-1,0);j++){ bytes.push(view.getUint8(dataOffset+j)); }
      entry.str = String.fromCharCode.apply(null, bytes);
    } else if(type === 5 || type === 10){
      var rationals = [];
      for(var k=0;k<numValues;k++){
        var num = view.getUint32(dataOffset+k*8, little);
        var den = view.getUint32(dataOffset+k*8+4, little);
        rationals.push(den ? num/den : 0);
      }
      entry.rationals = rationals;
    } else if(type === 3){
      entry.value = numValues===1 ? view.getUint16(dataOffset, little) : view.getUint32(valueOffset, little);
    } else if(type === 4){
      entry.value = view.getUint32(dataOffset, little);
    }
    entries.push(entry);
  }
  return entries;
}
function dmsToDecimal(rationals){ return rationals[0]+rationals[1]/60+rationals[2]/3600; }
function parseExifDate(str){
  var m = /^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/.exec(str||'');
  if(!m) return null;
  return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]), Number(m[4]), Number(m[5]), Number(m[6]));
}
function parseTiff(view, tiffStart, result){
  var little = view.getUint16(tiffStart) === 0x4949;
  var ifd0Offset = view.getUint32(tiffStart+4, little);
  var exifIfdOffset = null, gpsIfdOffset = null;
  readIfd(view, tiffStart, tiffStart+ifd0Offset, little).forEach(function(e){
    if(e.tag === 0x8769) exifIfdOffset = e.value;
    if(e.tag === 0x8825) gpsIfdOffset = e.value;
  });
  if(exifIfdOffset != null){
    readIfd(view, tiffStart, tiffStart+exifIfdOffset, little).forEach(function(e){
      if((e.tag === 0x9003 || e.tag === 0x9004) && e.str && !result.dateTimeOriginal) result.dateTimeOriginal = parseExifDate(e.str);
    });
  }
  if(gpsIfdOffset != null){
    var latRef=null, lat=null, lngRef=null, lng=null;
    readIfd(view, tiffStart, tiffStart+gpsIfdOffset, little).forEach(function(e){
      if(e.tag === 1) latRef = e.str;
      if(e.tag === 2) lat = e.rationals;
      if(e.tag === 3) lngRef = e.str;
      if(e.tag === 4) lng = e.rationals;
    });
    if(lat && lng){
      result.lat = dmsToDecimal(lat) * (latRef==='S'?-1:1);
      result.lng = dmsToDecimal(lng) * (lngRef==='W'?-1:1);
    }
  }
}
function parseExif(buffer){
  var result = {dateTimeOriginal:null, lat:null, lng:null};
  try {
    var view = new DataView(buffer);
    if(view.byteLength < 4 || view.getUint16(0) !== 0xFFD8) return result;
    var offset = 2;
    while(offset+4 <= view.byteLength){
      var marker = view.getUint16(offset);
      if(marker === 0xFFD9 || marker === 0xFFDA) break;
      var size = view.getUint16(offset+2);
      if(marker === 0xFFE1 && view.getUint32(offset+4) === 0x45786966 && view.getUint16(offset+8) === 0x0000){
        parseTiff(view, offset+10, result);
        return result;
      }
      offset += 2+size;
    }
  } catch(e){ console.warn('gagal baca EXIF foto', e); }
  return result;
}
function readFileAsArrayBuffer(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = function(){ reject(new Error('Gagal membaca file foto')); };
    reader.readAsArrayBuffer(file);
  });
}
function compressImage(file, maxDim, quality){
  maxDim = maxDim || 1280; quality = quality || 0.7;
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxDim/Math.max(img.width, img.height));
        var canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width*scale));
        canvas.height = Math.max(1, Math.round(img.height*scale));
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function(blob){
          if(!blob){ reject(new Error('Gagal mengompres foto')); return; }
          resolve(blob);
        }, 'image/jpeg', quality);
      };
      // data: URL, allowed by the app's Content-Security-Policy (img-src 'self' data:);
      // a blob: object URL would be silently blocked by that same policy.
      img.onerror = function(){ reject(new Error('Gagal membaca foto')); };
      img.src = reader.result;
    };
    reader.onerror = function(){ reject(new Error('Gagal membaca foto')); };
    reader.readAsDataURL(file);
  });
}
function blobToDataUrl(blob){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = function(){ reject(new Error('Gagal membaca foto')); };
    reader.readAsDataURL(blob);
  });
}

function evaluatePhotoMismatch(photo, checkoutPos, checkoutTime){
  var TEN_MIN = 10*60*1000;
  var timeDiff = Math.abs(new Date(photo.photoTime) - checkoutTime);
  var timeMismatch = timeDiff > TEN_MIN;
  var distanceMismatch, distance = null;
  if(photo.lat != null && photo.lng != null){
    distance = haversineMeters(photo.lat, photo.lng, checkoutPos.lat, checkoutPos.lng);
    distanceMismatch = distance > DEFAULT_RADIUS;
  } else {
    distanceMismatch = true;
  }
  if(!timeMismatch && !distanceMismatch) return null;
  return {timeMismatch:timeMismatch, distanceMismatch:distanceMismatch, timeDiffMinutes:Math.round(timeDiff/60000), distance:distance};
}

function sha256Hex(str){
  var enc=new TextEncoder().encode(str);
  return crypto.subtle.digest('SHA-256', enc).then(function(buf){
    return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  });
}
function hashPassword(key, pw){ return sha256Hex(key+':'+pw+':sft-salt-v1'); }

function csvEscapeField(val){ var s=String(val==null?'':val); return /[",\n]/.test(s) ? ('"'+s.replace(/"/g,'""')+'"') : s; }
function downloadRowsAsCSV(headers, rows, filename){
  var csv = [headers].concat(rows).map(function(r){ return r.map(csvEscapeField).join(','); }).join('\r\n');
  var blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
function parseCSV(text){
  var rows=[], row=[], field='', inQuotes=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
      else { field+=c; }
    } else {
      if(c==='"'){ inQuotes=true; }
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){ /* skip */ }
      else { field+=c; }
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows;
}

function handleImportUsersFile(file){
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var rows = parseCSV(String(e.target.result||'')).filter(function(r){ return r.some(function(c){ return c && c.trim(); }); });
    if(rows.length<2){ showToast('File CSV kosong atau formatnya tidak sesuai. Gunakan template yang disediakan.', true); return; }
    var dataRows = rows.slice(1);
    var validRoles = {sales:1, supervisor:1, owner:1};
    var seenKeys = {}, toCreate = [], skipped = 0;
    dataRows.forEach(function(r){
      var name=(r[0]||'').trim();
      var user=(r[1]||'').trim();
      var pass=(r[2]||'').trim();
      var role=(r[3]||'').trim().toLowerCase();
      if(!validRoles[role]) role='sales';
      var key=user.toLowerCase();
      if(!name || !key || pass.length<4){ skipped++; return; }
      if(S.users[key] || seenKeys[key]){ skipped++; return; }
      seenKeys[key]=true;
      toCreate.push({key:key, name:name, pass:pass, role:role});
    });
    if(toCreate.length===0){
      showToast('Tidak ada baris valid untuk diimpor. Pastikan Nama, Username, Password (min 4 karakter) terisi, dan username belum dipakai.', true);
      return;
    }
    Promise.all(toCreate.map(function(u){
      return hashPassword(u.key, u.pass).then(function(hash){ return {key:u.key, hash:hash, name:u.name, role:u.role}; });
    })).then(function(results){
      var users = Object.assign({}, S.users);
      results.forEach(function(r){
        users[r.key] = {username:r.key, displayName:r.name, passwordHash:r.hash, role:r.role, active:true, createdAt:new Date().toISOString()};
      });
      return saveUsers(users).then(function(){
        S.users = users;
        setState({errorMsg:''});
        showToast('✓ Berhasil impor '+results.length+' akun.' + (skipped>0 ? (' '+skipped+' baris dilewati (kosong/duplikat/password kurang dari 4 karakter).') : ''), false);
      });
    }).catch(alertSaveError);
  };
  reader.onerror = function(){ showToast('Gagal membaca file. Coba lagi.', true); };
  reader.readAsText(file, 'UTF-8');
}

function statCard(label, value, sub){

    (sub ? '<div class="xs muted mono">'+esc(sub)+'</div>' : '') + '</div>';

function filterChipsHTML(prefix, current, start, end){
  var opts=[['today','Hari ini'],['week','Minggu ini'],['month','Bulan ini'],['all','Semua'],['custom','Custom']];
  var chips = opts.map(function(o){ return '<button class="chip '+(current===o[0]?'active':'')+'" data-action="setFilter" data-prefix="'+prefix+'" data-val="'+o[0]+'">'+o[1]+'</button>'; }).join('');
  var customRow = current==='custom' ? (
    '<div class="row gap8" style="margin-top:8px;">' +
    '<input type="date" class="input mono xs" style="width:auto;padding:7px 10px;" id="'+prefix+'Start" value="'+(start||'')+'" data-daterange-prefix="'+prefix+'" data-daterange-which="start">' +
    '<span class="muted xs">s/d</span>' +
    '<input type="date" class="input mono xs" style="width:auto;padding:7px 10px;" id="'+prefix+'End" value="'+(end||'')+'" data-daterange-prefix="'+prefix+'" data-daterange-which="end">' +
    '</div>'
  ) : '';
  return '<div class="row gap6" style="flex-wrap:wrap;margin-bottom:8px;">'+chips+'</div>'+customRow;
}
function dailySummaryHTML(visits){
  var byDate={};
  visits.forEach(function(v){
    var key=new Date(v.checkinTime).toISOString().slice(0,10);
    if(!byDate[key]) byDate[key]={count:0,order:0,payment:0,iso:v.checkinTime};
    byDate[key].count+=1; byDate[key].order+=orderTotalOf(v); byDate[key].payment+=(v.payment||0);
  });
  var days=Object.keys(byDate).map(function(k){ return [k, byDate[k]]; }).sort(function(a,b){ return b[0].localeCompare(a[0]); });
  if(days.length===0) return '';
  var maxPay=Math.max.apply(null, days.map(function(d){ return d[1].payment; }).concat([1]));
  var rows = days.map(function(d){
    var pct = Math.max(4,(d[1].payment/maxPay)*100);
    return '<div class="row gap12" style="margin-bottom:9px;">' +
      '<span class="xs mono muted" style="width:88px;flex-shrink:0;">'+esc(fmtDateShort(d[1].iso))+'</span>' +
      '<div style="flex:1;height:6px;background:var(--chip-bg);border-radius:999px;overflow:hidden;"><div style="height:100%;background:var(--accent);border-radius:999px;width:'+pct+'%;"></div></div>' +
      '<span class="xs mono" style="width:34px;text-align:right;flex-shrink:0;">'+d[1].count+'x</span>' +
      '<span class="xs mono" style="width:90px;text-align:right;flex-shrink:0;color:#2F5B3B;">'+rp(d[1].payment)+'</span>' +
      '</div>';
  }).join('');
  return '<div class="card" style="margin-bottom:16px;"><h4 class="xs muted" style="text-transform:uppercase;letter-spacing:.03em;margin:0 0 12px;">Ringkasan harian</h4>'+rows+'</div>';
}
function visitRowHTML(v, showSales, openId){

    '<div style="flex:1;min-width:0;">' +
      '<div class="row gap6" style="flex-wrap:wrap;">' +
        '<span style="font-weight:600;font-size:14px;">'+esc(v.storeName)+'</span>' +
        (v.checkinOutOfRadius ? badge('⚠ luar radius','warn') : '') +
        (v.isManualEntry ? badge('📝 manual','neutral') : '') +
        badge(v.status==='active'?'Berlangsung':'Selesai', v.status==='active'?'active':'done') +
      '</div>' +
      '<div class="xs muted mono" style="margin-top:2px;">' + (showSales?esc(v.salesName)+' · ':'') + esc(fmtDate(v.checkinTime))+' · '+fmtTime(v.checkinTime)+'–'+(v.checkoutTime?fmtTime(v.checkoutTime):'...')+' · '+durationLabel(v.durationMinutes) +
      '</div>' +
    '</div>' +
    '<div class="mono xs" style="text-align:right;flex-shrink:0;line-height:1.5;">' +
      '<div style="color:var(--primary);font-weight:600;">'+rp(total)+' <span class="muted" style="font-weight:400;">order</span></div>' +
      '<div style="color:#2F5B3B;">'+rp(v.payment)+' <span class="muted" style="font-weight:400;">bayar</span></div>' +
    '</div>' +

  var detail='';
  if(open){
    detail += '<div style="padding:0 14px 14px;border-top:1px solid #EFEBE2;">';
    detail += '<div class="grid2 xs" style="padding-top:12px;">';
    detail += '<div><div class="muted" style="margin-bottom:2px;">Lokasi check-in</div>' + (mapsLink ? ('<a class="mono" href="'+mapsLink+'" target="_blank" rel="noreferrer">'+v.checkinLat.toFixed(4)+', '+v.checkinLng.toFixed(4)+'</a>') : '<span class="muted">-</span>') + (v.checkinDistanceMeters!=null ? ('<div class="muted" style="margin-top:2px;">'+distLabel(v.checkinDistanceMeters)+' dari titik acuan</div>') : '') + (v.checkinAccuracy!=null ? ('<div class="muted" style="margin-top:2px;">akurasi GPS: ±'+Math.round(v.checkinAccuracy)+'m</div>') : '') + '</div>';
    detail += '<div><div class="muted" style="margin-bottom:2px;">Tanggal</div><span class="mono">'+esc(fmtDate(v.checkinTime))+'</span></div>';
    detail += '</div>';
    if(v.checkinOutOfRadius && v.checkinOverrideReason){
      detail += '<div style="background:var(--danger-bg);border:1px solid #C1502E40;border-radius:10px;padding:10px;margin-top:10px;"><div class="xs" style="color:var(--danger);font-weight:600;margin-bottom:2px;">⚠ Alasan override lokasi</div><p class="xs" style="margin:0;">'+esc(v.checkinOverrideReason)+'</p></div>';
    }
    if(v.isManualEntry){
      detail += '<div class="xs muted" style="margin-top:10px;">📝 Kunjungan ini dicatat manual oleh <b>'+esc(v.enteredBy||'-')+'</b> (bukan hasil check-in GPS langsung).</div>';
    }
    if((v.orders||[]).length>0){
      detail += '<div style="margin-top:10px;"><div class="xs muted" style="margin-bottom:6px;">Order ('+v.orders.length+' item · '+rp(total)+')</div>';
      detail += v.orders.map(function(o){ return '<div class="row between xs" style="background:var(--bg);border-radius:8px;padding:7px 10px;margin-bottom:4px;"><span>'+esc(o.product)+' × '+o.qty+'</span><span class="mono">'+rp(o.qty*o.price)+'</span></div>'; }).join('');
      detail += '</div>';
    }
    if(v.paymentPhotoUrl){
      detail += '<div style="margin-top:10px;"><div class="xs muted row gap6" style="margin-bottom:6px;align-items:center;">Bukti pembayaran'+(v.paymentPhotoMismatch?(' '+badge('⚠ waktu/lokasi tidak sesuai','warn')):'')+'</div>' +
        '<a href="'+esc(v.paymentPhotoUrl)+'" target="_blank" rel="noreferrer"><img src="'+esc(v.paymentPhotoUrl)+'" style="width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--border);"></a>' +
        (v.paymentPhotoMismatch && v.paymentPhotoMismatchReason ? '<p class="xs muted" style="margin:6px 0 0;">Alasan: '+esc(v.paymentPhotoMismatchReason)+'</p>' : '') +
      '</div>';
    }
    if(v.notes){ detail += '<div style="margin-top:10px;"><div class="xs muted" style="margin-bottom:2px;">Catatan</div><p class="xs" style="margin:0;">'+esc(v.notes)+'</p></div>'; }
    if(v.status==='done' && S.session && (S.session.role==='owner' || S.session.role==='supervisor')){
      detail += '<button class="btn btn-outline btn-sm" style="margin-top:12px;" data-action="openEditVisit" data-checkin="'+esc(v.checkinTime)+'" data-sales="'+esc(v.salesName)+'">✏️ Edit Order/Pembayaran</button>';
    }
    detail += '</div>';
  }
  return '<div class="card2" style="margin-bottom:8px;">'+head+detail+'</div>';
}

    '</div>';
    html += '<div class="row gap8" style="margin:8px 0 16px;flex-wrap:wrap;">' +
      '<button class="btn btn-dark btn-sm" data-action="exportDash" '+(scoped.length===0?'disabled':'')+'>⬇ Export CSV ('+scoped.length+' kunjungan)</button>' +
      '<button class="btn btn-outline btn-sm" data-action="openManualEntry">+ Tambah Kunjungan Manual</button>' +
    '</div>';

      statCard('Sales aktif', Object.keys(bySales).length, flagged>0 ? ('⚠ '+flagged+' luar radius') : '') +

        html += '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function storesManagementHTML(){
  var stores = S.storesCache || {};
  var keys = Object.keys(stores).sort(function(a,b){ return stores[a].name.localeCompare(stores[b].name); });
  var html = '<div class="row between" style="margin-bottom:8px;flex-wrap:wrap;gap:8px;">' +
    '<p class="xs muted" style="margin:0;flex:1;min-width:200px;">Lokasi & kecamatan/kota terdeteksi otomatis dari check-in pertama sales — bisa dikoreksi manual di bawah.</p>' +
    '<button data-action="reloadStores" style="background:none;border:none;color:var(--primary);padding:6px;flex-shrink:0;">⟳</button>' +
  '</div>';
  html += '<a href="/api/export-stores" class="btn btn-dark btn-sm" style="margin-bottom:14px;display:inline-flex;">⬇ Export Data Toko (Excel)</a>';
  html += '<input class="input" id="storeSearchInput" autocomplete="off" placeholder="🔍 Cari nama toko..." style="margin-bottom:14px;">';
  var suspiciousReps = computeSuspiciousReps(stores);
  if(suspiciousReps.length>0){
    html += '<div class="card" style="margin-bottom:16px;border:1px solid #C1502E;background:#C1502E12;">' +
      '<h4 class="xs" style="text-transform:uppercase;margin:0 0 8px;color:#C1502E;">🚨 Pola Titik GPS Mencurigakan Per Sales</h4>' +
      '<p class="xs muted" style="margin:0 0 10px;">Sales ini mendaftarkan banyak nama toko berbeda, tapi sebagian besar berada di titik GPS yang sama/nyaris sama — indikasi kuat sebagian tidak benar-benar dikunjungi.</p>';
    suspiciousReps.forEach(function(r){
      html += '<div class="xs" style="margin-bottom:4px;">• <b>'+esc(r.creator)+'</b>: '+r.total+' toko terdaftar, hanya <b>'+r.uniqueCount+' titik GPS unik</b> ('+Math.round(r.ratio*100)+'%)</div>';
    });
    html += '</div>';
  }
  var dupes = computeSuspectedDuplicates(stores, S.dismissedDupes);
  if(dupes.length>0){
    html += '<div class="card" style="margin-bottom:16px;border:1px solid #C1502E;">' +
      '<h4 class="xs" style="text-transform:uppercase;margin:0 0 8px;color:#C1502E;">⚠ Kemungkinan Toko Duplikat ('+dupes.length+')</h4>' +
      '<p class="xs muted" style="margin:0 0 10px;">Dua nama toko dengan titik lokasi berdekatan (≤'+DUPLICATE_DISTANCE_THRESHOLD+'m) — cek ke lapangan, lalu tandai "Toko Berbeda" kalau sudah dikonfirmasi bukan toko yang sama.</p>';
    dupes.forEach(function(p){
      var sa = visitStatsForStoreName(p.a.name), sb = visitStatsForStoreName(p.b.name);
      var isBusy = S.mergeBusyKey===p.pairKey, showPicker = S.mergePickerKey===p.pairKey;

/* ---------------- render dispatch ---------------- */
function render(){
  var app = document.getElementById('app');
  var html;
  if(S.screen==='loading'){
    html = '<div class="center-screen"><span style="font-size:20px;" class="spin">⟳</span><span class="xs muted mono">Memuat...</span></div>';
  } else if(S.screen==='autherror'){
    html = '<div class="center-screen">' +
      '<span style="font-size:26px;">⚠</span>' +
      '<h2 class="display" style="font-size:17px;color:var(--primary);margin:4px 0;">Gagal memuat aplikasi</h2>' +
      '<p class="small muted" style="max-width:300px;">'+esc(S.errorMsg)+'</p>' +
      '<button class="btn btn-dark" data-action="retryAuth">⟳ Coba lagi</button>' +
    '</div>';
  } else if(S.screen==='setup'){
    html = screenSetup();
  } else if(S.screen==='login'){
    html = screenLogin();
  } else if(S.screen==='locationcheck'){
    html = screenLocationCheck();
  } else if(S.screen==='sales'){
    html = screenSales();
  } else if(S.screen==='dashboard'){
    html = screenDashboard();
  } else {
    html = '<div class="center-screen"><p>Layar tidak dikenali.</p></div>';
  }
  app.innerHTML = html;
  startTimerIfNeeded();
  if(S.checkinStage==='entering') renderStoreSuggestions(S.storeNameDraft||'');
}

function startTimerIfNeeded(){
  if(S.timerHandle){ clearInterval(S.timerHandle); S.timerHandle=null; }
  var el = document.getElementById('liveTimer');
  if(!el) return;
  var start = new Date(el.getAttribute('data-start')).getTime();
  function tick(){
    var elapsed = Math.max(0, Math.floor((Date.now()-start)/1000));
    var h=Math.floor(elapsed/3600), m=Math.floor((elapsed%3600)/60), s=elapsed%60;
    function pad(n){ return String(n).padStart(2,'0'); }
    el.textContent = h>0 ? (pad(h)+':'+pad(m)+':'+pad(s)) : (pad(m)+':'+pad(s));
  }
  tick();
  S.timerHandle = setInterval(tick, 1000);
}

/* ---------------- actions ---------------- */
var Actions = {
  retryAuth: function(){ initAuth(); },

  openLocationCheck: function(){ setState({screen:'locationcheck', locationCheckResult:null}); Actions.recheckLocation(); },
  backToLogin: function(){ setState({screen:'login', locationCheckResult:null, locationCheckBusy:false}); },
  recheckLocation: function(){
    setState({locationCheckBusy:true, locationCheckResult:null});
    getPosition().then(function(pos){ setState({locationCheckBusy:false, locationCheckResult:pos}); });
  },

  submitSetup: function(){
    var name=(document.getElementById('su_name').value||'').trim();
    var user=(document.getElementById('su_user').value||'').trim();
    var pass=document.getElementById('su_pass').value||'';
    var pass2=document.getElementById('su_pass2').value||'';
    S.setupDraft = {name:name, user:user};
    if(!name || !user || pass.length<4){ setState({errorMsg:'Lengkapi semua kolom. Password minimal 4 karakter.'}); return; }
    if(pass!==pass2){ setState({errorMsg:'Konfirmasi password tidak cocok.'}); return; }
    setState({busy:true, errorMsg:''});
    var key=user.toLowerCase();
    hashPassword(key, pass).then(function(hash){
      var users={}; users[key]={username:key, displayName:name, passwordHash:hash, role:'owner', active:true, createdAt:new Date().toISOString()};
      return saveUsers(users);
    }).then(function(){ setState({busy:false}); initAuth(); })
      .catch(function(e){ setState({busy:false, errorMsg:'Gagal menyimpan akun: '+(e&&e.message?e.message:'terjadi kesalahan')+'. Coba lagi.'}); });
  },

  submitLogin: function(){
    var user=(document.getElementById('li_user').value||'').trim();
    var pass=document.getElementById('li_pass').value||'';
    if(!user || !pass){ setState({errorMsg:'Isi username dan password.'}); return; }
    setState({busy:true, errorMsg:''});
    loadUsers().then(function(users){
      var key=user.toLowerCase();
      var u=users[key];
      if(!u){ setState({busy:false, errorMsg:'Username tidak ditemukan.'}); return; }
      if(!u.active){ setState({busy:false, errorMsg:'Akun dinonaktifkan. Hubungi atasan Anda.'}); return; }
      return hashPassword(key, pass).then(function(hash){
        if(hash!==u.passwordHash){ setState({busy:false, errorMsg:'Password salah.'}); return; }
        enterApp({role:u.role, name:u.displayName, username:u.username});
      });
    });
  },

  logout: function(){
    if(S.timerHandle){ clearInterval(S.timerHandle); S.timerHandle=null; }
    clearSessionLocal();
    setState({session:null, screen:'login', errorMsg:'', salesTab:'home', checkinStage:'idle', dashTab:'visits', expandedSales:null, expandedVisit:null});
  },

  setSalesTab: function(el){ setState({salesTab: el.getAttribute('data-val')}); },
  switchScreen: function(el){ setState({screen: el.getAttribute('data-val')}); },
  setDashTab: function(el){
    var val = el.getAttribute('data-val');
    setState({dashTab: val});
    if(val==='stores') Actions.reloadStores();
  },

  startCheckin: function(){
    var names = {};
    myVisits().forEach(function(v){
      var n = String(v.storeName||'').trim();
      if(n) names[n] = true;
    });
    setState({checkinStage:'entering', gpsError:'', storeNames: Object.keys(names).sort(), storeNameDraft:'', nearbyStores:[]});
    loadStores().then(function(stores){
      Object.keys(stores).forEach(function(k){
        var n = String(stores[k].name||'').trim();
        if(n) names[n] = true;
      });
      setState({storeNames: Object.keys(names).sort()});
      if(S.checkinStage!=='entering') return;
      getPosition().then(function(pos){
        if(pos.error || S.checkinStage!=='entering') return;
        var nearby = Object.keys(stores).map(function(k){
          var s = stores[k];
          if(s.lat==null || s.lng==null) return null;
          return {name:s.name, dist:haversineMeters(pos.lat, pos.lng, s.lat, s.lng)};
        }).filter(function(x){ return x && x.dist<=NEARBY_SUGGESTION_RADIUS; })
          .sort(function(a,b){ return a.dist-b.dist; });
        setState({nearbyStores: nearby});
      });
    });
  },
  cancelCheckin: function(){ setState({checkinStage:'idle', outOfRadius:null, gpsError:'', storeNameDraft:'', nearbyStores:[]}); },

  attemptCheckin: function(){
    var storeInput = document.getElementById('storeNameInput');
    var storeName = storeInput ? storeInput.value.trim() : '';
    if(!storeName){ setState({gpsError:'Nama toko belum diisi. Ketik dulu nama tokonya.'}); return; }
    setState({busy:true, gpsError:''});
    getPosition().then(function(pos){
      if(pos.error){ setState({busy:false, gpsError:pos.error}); return; }
      var key = storeName.toLowerCase();
      loadStores().then(function(stores){
        var store = stores[key];
        if(store && store.lat!=null && store.lng!=null){
          var distance = haversineMeters(pos.lat, pos.lng, store.lat, store.lng);
          var radius = store.radius || DEFAULT_RADIUS;
          if(distance > radius){
            setState({busy:false, outOfRadius:{distance:distance, radius:radius, storeKey:key, pos:pos, storeName:store.name}, checkinStage:'outOfRadius'});
            return;
          }
          finalizeCheckin(pos, store.name, {distanceMeters:distance, outOfRadius:false});
        } else {
          var newStores = Object.assign({}, stores);
          newStores[key] = {name:storeName, lat:pos.lat, lng:pos.lng, accuracy:pos.accuracy, radius:DEFAULT_RADIUS, kecamatan:'', kota:'', createdBy:S.session.name, createdAt:new Date().toISOString()};
          saveStores(newStores).then(function(){
            finalizeCheckin(pos, storeName, {distanceMeters:0, outOfRadius:false, isNewStore:true});
            // Deferred well after check-in completes so it never competes for resources at the critical moment.
            setTimeout(function(){
              try { geocodeStoreBestEffort(key, pos.lat, pos.lng); } catch(e){ console.warn('geocode skipped', e); }
            }, 4000);
          }).catch(function(e){ setState({busy:false, gpsError:'Gagal menyimpan lokasi toko: '+(e&&e.message?e.message:'terjadi kesalahan')}); });
        }
      }).catch(function(e){ setState({busy:false, gpsError:'Gagal memuat data toko: '+(e&&e.message?e.message:'terjadi kesalahan')}); });
    });
  },
  retryCheckin: function(){ setState({checkinStage:'entering', outOfRadius:null}); Actions.attemptCheckin(); },
  selectStoreSuggestion: function(el){
    var name = el.getAttribute('data-name');
    var input = document.getElementById('storeNameInput');
    if(input) input.value = name;
    var list = document.getElementById('storeSuggestionList');
    if(list) list.innerHTML = '';
  },
  confirmOverride: function(){
    var reasonEl = document.getElementById('overrideReason');
    var reason = reasonEl ? reasonEl.value.trim() : '';
    if(!reason || !S.outOfRadius) return;
    setState({busy:true});
    finalizeCheckin(S.outOfRadius.pos, S.outOfRadius.storeName, {distanceMeters:S.outOfRadius.distance, outOfRadius:true, overrideReason:reason});
  },

  openOrderForm: function(){ setState({orderFormOpen:true, orderItems:[{id:uid(), product:'', qty:1, price:0}], orderPaymentDraft:'', orderNotesDraft:'', paymentPhoto:null, pendingCheckout:null, photoMismatchInfo:null}); },
  closeOrderForm: function(){ setState({orderFormOpen:false, orderPaymentDraft:'', orderNotesDraft:'', paymentPhoto:null, pendingCheckout:null, photoMismatchInfo:null}); },
  addOrderItem: function(){ syncOrderFormFromDOM(); S.orderItems.push({id:uid(), product:'', qty:1, price:0}); render(); },
  removeOrderItem: function(el){ syncOrderFormFromDOM(); var idx=Number(el.getAttribute('data-idx')); S.orderItems.splice(idx,1); render(); },
  selectPaymentPhoto: function(file){
    if(!/^image\//.test(file.type)){ showToast('File yang dipilih bukan foto.', true); return; }
    setState({paymentPhoto:{status:'processing'}});
    var exifResult = {dateTimeOriginal:null, lat:null, lng:null};
    readFileAsArrayBuffer(file).then(function(buffer){
      exifResult = parseExif(buffer);
      return withTimeout(compressImage(file), 20000);
    }).then(function(blob){
      return blobToDataUrl(blob).then(function(dataUrl){
        var lat = exifResult.lat, lng = exifResult.lng;
        var locationSource = (lat!=null && lng!=null) ? 'exif' : null;
        var photoTime = exifResult.dateTimeOriginal || new Date();
        function finish(){
          setState({paymentPhoto:{status:'ready', dataUrl:dataUrl, photoTime:photoTime.toISOString(), lat:lat, lng:lng, locationSource:locationSource}});
        }
        if(lat == null){
          getPosition().then(function(pos){
            if(!pos.error){ lat = pos.lat; lng = pos.lng; locationSource = 'geolocation'; }
            finish();
          });
        } else {
          finish();
        }
      });
    }).catch(function(e){
      console.error('gagal memproses foto', e);
      reportClientError('selectPaymentPhoto', e);
      setState({paymentPhoto:{status:'error', error:(e&&e.message)||'Gagal memproses foto'}});
    });
  },
  removePaymentPhoto: function(){ setState({paymentPhoto:null}); },
  submitCheckout: function(){
    syncOrderItemsFromDOM();
    var paymentEl = document.getElementById('orderPayment');
    var notesEl = document.getElementById('orderNotesInput');
    var payment = Number(paymentEl ? paymentEl.value : 0) || 0;
    var notes = notesEl ? notesEl.value : '';
    var orders = S.orderItems.filter(function(i){ return i.product.trim(); }).map(function(i){ return {id:i.id, product:i.product, qty:Number(i.qty)||0, price:Number(i.price)||0}; });
    var mv = myVisits();
    var active = mv.filter(function(v){ return v.status==='active'; })[0];
    if(!active) return;
    if(payment > 0 && (!S.paymentPhoto || S.paymentPhoto.status !== 'ready')){
      showToast('Ada pembayaran diterima — foto bukti tanda terima wajib dilampirkan.', true);
      return;
    }
    setState({busy:true});
    getPosition().then(function(pos){
      if(pos.error){ setState({busy:false}); showToast('Gagal mengambil lokasi check-out: '+pos.error, true); return; }
      finishCheckout(active, pos, orders, payment, notes, null);
    }).catch(function(e){ setState({busy:false}); alertSaveError(e); });
  },
  confirmPhotoMismatch: function(){
    var reasonEl = document.getElementById('photoMismatchReason');
    var reason = reasonEl ? reasonEl.value.trim() : '';
    if(!reason || !S.pendingCheckout) return;
    setState({busy:true});
    var pc = S.pendingCheckout;
    finishCheckout(pc.active, pc.pos, pc.orders, pc.payment, pc.notes, reason);
  },
  cancelPhotoMismatch: function(){ setState({busy:false, pendingCheckout:null, photoMismatchInfo:null}); },

  openEditVisit: function(el){
    var checkin = el.getAttribute('data-checkin');
    var sales = el.getAttribute('data-sales');
    var visit = S.visits.filter(function(v){ return v.checkinTime===checkin && v.salesName===sales; })[0];
    if(!visit) return;
    var items = (visit.orders && visit.orders.length) ? visit.orders.map(function(o){ return {id:o.id||uid(), product:o.product, qty:o.qty, price:o.price}; }) : [{id:uid(), product:'', qty:1, price:0}];
    setState({editingVisit: visit, editOrderItems: items});
  },
  closeEditVisit: function(){ setState({editingVisit:null, editOrderItems:[]}); },
  addEditOrderItem: function(){ syncEditOrderItemsFromDOM(); S.editOrderItems.push({id:uid(), product:'', qty:1, price:0}); render(); },
  removeEditOrderItem: function(el){ syncEditOrderItemsFromDOM(); var idx=Number(el.getAttribute('data-idx')); S.editOrderItems.splice(idx,1); render(); },
  submitEditVisit: function(){
    syncEditOrderItemsFromDOM();
    var paymentEl = document.getElementById('editPayment');
    var notesEl = document.getElementById('editNotesInput');
    var payment = Number(paymentEl ? paymentEl.value : 0) || 0;
    var notes = notesEl ? notesEl.value : '';
    var orders = S.editOrderItems.filter(function(i){ return i.product.trim(); }).map(function(i){ return {id:i.id, product:i.product, qty:Number(i.qty)||0, price:Number(i.price)||0}; });
    var target = S.editingVisit;
    if(!target || !target.id) return;
    setState({busy:true});
    var updatedVisit = Object.assign({}, target, {orders:orders, payment:payment, notes:notes});
    upsertVisit(updatedVisit).then(function(){ return refreshVisitsSilent(); }).then(function(){
      setState({busy:false, editingVisit:null, editOrderItems:[]});
      showToast('✓ Kunjungan berhasil diperbarui.', false);
    }).catch(function(e){ setState({busy:false}); alertSaveError(e); });
  },

  openManualEntry: function(){ setState({manualEntryOpen:true, manualOrderItems:[{id:uid(), product:'', qty:1, price:0}]}); },
  closeManualEntry: function(){ setState({manualEntryOpen:false, manualOrderItems:[]}); },
  addManualOrderItem: function(){ syncManualOrderItemsFromDOM(); S.manualOrderItems.push({id:uid(), product:'', qty:1, price:0}); render(); },
  removeManualOrderItem: function(el){ syncManualOrderItemsFromDOM(); var idx=Number(el.getAttribute('data-idx')); S.manualOrderItems.splice(idx,1); render(); },
  submitManualEntry: function(){
    var salesEl = document.getElementById('manualSalesName');
    var storeEl = document.getElementById('manualStoreName');
    var checkinEl = document.getElementById('manualCheckin');
    var checkoutEl = document.getElementById('manualCheckout');
    var paymentEl = document.getElementById('manualPayment');
    var notesEl = document.getElementById('manualNotesInput');
    var salesName = salesEl ? salesEl.value : '';
    var storeName = storeEl ? storeEl.value.trim() : '';
    var checkinVal = checkinEl ? checkinEl.value : '';
    var checkoutVal = checkoutEl ? checkoutEl.value : '';
    if(!salesName || !storeName || !checkinVal || !checkoutVal){
      showToast('Lengkapi nama sales, nama toko, jam masuk, dan jam keluar.', true);
      return;
    }
    var checkinTime = new Date(checkinVal).toISOString();
    var checkoutTime = new Date(checkoutVal).toISOString();
    var durationMinutes = (new Date(checkoutTime) - new Date(checkinTime)) / 60000;
    if(durationMinutes < 0){ showToast('Jam keluar harus setelah jam masuk.', true); return; }
    syncManualOrderItemsFromDOM();
    var payment = Number(paymentEl ? paymentEl.value : 0) || 0;
    var notes = notesEl ? notesEl.value : '';
    var orders = S.manualOrderItems.filter(function(i){ return i.product.trim(); }).map(function(i){ return {id:i.id, product:i.product, qty:Number(i.qty)||0, price:Number(i.price)||0}; });
    var newVisit = {
      id: uid(), salesName: salesName, storeName: storeName,
      checkinTime: checkinTime, checkinLat: null, checkinLng: null,
      checkinDistanceMeters: null, checkinOutOfRadius: false, checkinOverrideReason: '', isNewStore: false,
      checkoutTime: checkoutTime, checkoutLat: null, checkoutLng: null,
      status: 'done', orders: orders, payment: payment, notes: notes,
      durationMinutes: durationMinutes,
      isManualEntry: true, enteredBy: S.session.name
    };
    setState({busy:true});
    upsertVisit(newVisit).then(function(){ return refreshVisitsSilent(); }).then(function(){
      setState({busy:false, manualEntryOpen:false, manualOrderItems:[]});
      showToast('✓ Kunjungan manual berhasil ditambahkan.', false);
    }).catch(function(e){ setState({busy:false}); alertSaveError(e); });
  },

  toggleVisit: function(el){ var id=el.getAttribute('data-id'); setState({expandedVisit: S.expandedVisit===id?null:id}); },
  setFilter: function(el){
    var prefix=el.getAttribute('data-prefix'), val=el.getAttribute('data-val');
    if(prefix==='riwayat') setState({riwayatFilter:val});
    else setState({dashFilter:val});
  },
  setDateRange: function(el){
    var prefix=el.getAttribute('data-daterange-prefix'), which=el.getAttribute('data-daterange-which'), val=el.value;
    var patch={};
    if(prefix==='riwayat') patch[which==='start'?'riwayatStart':'riwayatEnd']=val;
    else patch[which==='start'?'dashStart':'dashEnd']=val;
    setState(patch);
  },
  exportRiwayat: function(){
    var mv = myVisits();
    var riwayat = mv.filter(function(v){ return v.status==='done' && isInRange(v.checkinTime, S.riwayatFilter, S.riwayatStart, S.riwayatEnd); });
    exportCSV(riwayat, 'riwayat-'+S.session.name.replace(/\s+/g,'-').toLowerCase());
  },
  exportDash: function(){
    var scoped = S.visits.filter(function(v){ return isInRange(v.checkinTime, S.dashFilter, S.dashStart, S.dashEnd); });
    exportCSV(scoped, 'laporan-kunjungan');
  },

  toggleSales: function(el){ var name=el.getAttribute('data-name'); setState({expandedSales: S.expandedSales===name?null:name}); },
  refreshVisits: function(){ refreshVisitsSilent().then(function(){ render(); }); },

  reloadStores: function(){
    Promise.all([loadStores(), loadDismissedDupes()]).then(function(res){
      S.storesCache=res[0]; S.dismissedDupes=res[1]; render();
    });
  },
  dismissDuplicatePair: function(el){
    var keyA=el.getAttribute('data-keya'), keyB=el.getAttribute('data-keyb');
    var pairKey=dupePairKey(keyA, keyB);
    var dismissed=Object.assign({}, S.dismissedDupes);
    dismissed[pairKey]={dismissedBy:S.session.name, dismissedAt:new Date().toISOString()};
    saveDismissedDupes(dismissed).then(function(){ S.dismissedDupes=dismissed; showToast('✓ Ditandai sebagai toko berbeda.', false); render(); }).catch(alertSaveError);
  },
  toggleMergePicker: function(el){
    var pairKey=el.getAttribute('data-pairkey');
    setState({mergePickerKey: S.mergePickerKey===pairKey ? null : pairKey});
  },
  mergeStorePair: function(el){
    var keyA=el.getAttribute('data-keya'), keyB=el.getAttribute('data-keyb'), keep=el.getAttribute('data-keep');
    var keepKey = keep==='a' ? keyA : keyB, dropKey = keep==='a' ? keyB : keyA;
    var pairKey=dupePairKey(keyA, keyB);
    setState({mergeBusyKey:pairKey, mergePickerKey:null});
    mergeStoreNames(keepKey, dropKey).then(function(result){
      S.storesCache = result.stores;
      S.visits = result.visits;
      setState({mergeBusyKey:null});
      showToast('✓ Digabungkan ke "'+result.keepName+'" ('+result.movedCount+' kunjungan dipindahkan).', false);
    }).catch(function(e){
      setState({mergeBusyKey:null});
      alertSaveError(e);
    });
  },
  saveLocationLabels: function(el){
    var key=el.getAttribute('data-key');
    var kec=document.getElementById('kec_'+key);
    var kota=document.getElementById('kota_'+key);
    var stores=Object.assign({}, S.storesCache);
    stores[key]=Object.assign({}, stores[key], {kecamatan:(kec?kec.value.trim():''), kota:(kota?kota.value.trim():'')});
    saveStores(stores).then(function(){ S.storesCache=stores; showToast('✓ Kecamatan/Kota tersimpan.', false); render(); }).catch(alertSaveError);
  },

  saveRadius: function(el){
    var key=el.getAttribute('data-key');
    var input=document.getElementById('radius_'+key);
    var newRadius=Number(input.value)||DEFAULT_RADIUS;
    var stores=Object.assign({}, S.storesCache);
    stores[key]=Object.assign({}, stores[key], {radius:newRadius});
    saveStores(stores).then(function(){ S.storesCache=stores; render(); }).catch(alertSaveError);
  },
  resetStoreLocation: function(el){
    var key=el.getAttribute('data-key');
    var stores=Object.assign({}, S.storesCache);
    delete stores[key];
    saveStores(stores).then(function(){ S.storesCache=stores; render(); }).catch(alertSaveError);
  },

  downloadUserTemplate: function(){ downloadUserTemplateCSV(); },
  triggerImportUsers: function(){ var el=document.getElementById('importUserFile'); if(el) el.click(); },

  createUser: function(){
    var name=(document.getElementById('nu_name').value||'').trim();
    var user=(document.getElementById('nu_user').value||'').trim();
    var role=document.getElementById('nu_role').value;
    var pass=document.getElementById('nu_pass').value||'';
    if(!name || !user || pass.length<4){ setState({errorMsg:'Lengkapi nama, username, password (min 4 karakter).'}); return; }
    var key=user.toLowerCase();
    if(S.users[key]){ setState({errorMsg:'Username sudah dipakai.'}); return; }
    hashPassword(key, pass).then(function(hash){
      var users=Object.assign({}, S.users);
      users[key]={username:key, displayName:name, passwordHash:hash, role:role, active:true, createdAt:new Date().toISOString()};
      return saveUsers(users).then(function(){ S.users=users; setState({errorMsg:''}); });
    }).catch(function(e){ setState({errorMsg:'Gagal membuat akun: '+(e&&e.message?e.message:'terjadi kesalahan')}); });
  },
  toggleActive: function(el){
    var key=el.getAttribute('data-key');
    var users=Object.assign({}, S.users);
    users[key]=Object.assign({}, users[key], {active: !users[key].active});
    saveUsers(users).then(function(){ S.users=users; render(); }).catch(alertSaveError);
  },
  toggleResetPw: function(el){ var key=el.getAttribute('data-key'); setState({resetKey: S.resetKey===key?null:key}); },
  submitResetPw: function(el){
    var key=el.getAttribute('data-key');
    var input=document.getElementById('resetPwInput');
    var pw=input?input.value:'';
    if(pw.length<4) return;
    hashPassword(key, pw).then(function(hash){
      var users=Object.assign({}, S.users);
      users[key]=Object.assign({}, users[key], {passwordHash:hash});
      return saveUsers(users).then(function(){ S.users=users; setState({resetKey:null}); });
    }).catch(alertSaveError);
  },

  askResetData: function(el){ setState({confirmReset: el.getAttribute('data-kind')}); },
  cancelResetData: function(){ setState({confirmReset: null}); },
  confirmResetData: function(){
    clearAllVisits().then(function(){
      setState({confirmReset: null});
      S.visits = [];
      showToast('✓ Data riwayat kunjungan berhasil dihapus.', false);
      render();
    }).catch(function(e){
      setState({confirmReset: null});
      alertSaveError(e);
    });
  },

  noop: function(){}
};

function renderStoreSuggestions(query){
  var list = document.getElementById('storeSuggestionList');
  if(!list) return;
  var q = (query||'').trim().toLowerCase();
  if(!q){
    if(S.nearbyStores && S.nearbyStores.length>0){
      list.innerHTML = S.nearbyStores.slice(0,6).map(function(n){
        return '<button type="button" class="btn btn-ghost btn-sm" data-action="selectStoreSuggestion" data-name="'+esc(n.name)+'" style="display:block;width:100%;text-align:left;margin-top:6px;">📍 '+esc(n.name)+' <span class="xs muted">('+distLabel(n.dist)+')</span></button>';
      }).join('');
    } else {
      list.innerHTML = '';
    }
    return;
  }
  var matches = S.storeNames.filter(function(n){ return n.toLowerCase().indexOf(q) !== -1; }).slice(0,6);
  list.innerHTML = matches.map(function(n){
    return '<button type="button" class="btn btn-ghost btn-sm" data-action="selectStoreSuggestion" data-name="'+esc(n)+'" style="display:block;width:100%;text-align:left;margin-top:6px;">'+esc(n)+'</button>';
  }).join('');
}
function syncOrderItemsFromDOM(){
  var fields = document.querySelectorAll('[data-order-field]');
  fields.forEach(function(f){
    var idx=Number(f.getAttribute('data-idx'));
    var field=f.getAttribute('data-order-field');
    if(!S.orderItems[idx]) return;
    S.orderItems[idx][field] = field==='product' ? f.value : f.value;
  });
}
function syncOrderFormFromDOM(){
  syncOrderItemsFromDOM();
  var paymentEl = document.getElementById('orderPayment');
  var notesEl = document.getElementById('orderNotesInput');
  if(paymentEl) S.orderPaymentDraft = paymentEl.value;
  if(notesEl) S.orderNotesDraft = notesEl.value;
}
function syncEditOrderItemsFromDOM(){
  var fields = document.querySelectorAll('[data-editorder-field]');
  fields.forEach(function(f){
    var idx=Number(f.getAttribute('data-idx'));
    var field=f.getAttribute('data-editorder-field');
    if(!S.editOrderItems[idx]) return;
    S.editOrderItems[idx][field] = f.value;
  });
}
function syncManualOrderItemsFromDOM(){
  var fields = document.querySelectorAll('[data-manualorder-field]');
  fields.forEach(function(f){
    var idx=Number(f.getAttribute('data-idx'));
    var field=f.getAttribute('data-manualorder-field');
    if(!S.manualOrderItems[idx]) return;
    S.manualOrderItems[idx][field] = f.value;
  });
}

function geocodeStoreBestEffort(storeKey, lat, lng){
  // Runs quietly in the background after check-in already succeeded; failures are non-fatal.
  fetch('/api/geocode?lat='+encodeURIComponent(lat)+'&lng='+encodeURIComponent(lng))
    .then(function(res){ return res.ok ? res.json() : null; })
    .then(function(data){
      if(!data || (!data.kecamatan && !data.kota)) return;
      return loadStores().then(function(stores){
        if(!stores[storeKey]) return; // store may have been reset/removed meanwhile
        var updated = Object.assign({}, stores);
        updated[storeKey] = Object.assign({}, updated[storeKey], {kecamatan: data.kecamatan||'', kota: data.kota||''});
        return saveStores(updated).then(function(){
          if(S.storesCache) { S.storesCache = updated; render(); }
        });
      });
    })
    .catch(function(e){ console.warn('gagal deteksi kecamatan/kota (tidak fatal)', e); });
}

function finalizeCheckin(pos, storeName, meta){
  function saveNewCheckin(){
    var newVisit = {
      id:uid(), salesName:S.session.name, storeName:storeName,
      checkinTime:new Date().toISOString(), checkinLat:pos.lat, checkinLng:pos.lng, checkinAccuracy:pos.accuracy,
      checkinDistanceMeters: meta.distanceMeters, checkinOutOfRadius: !!meta.outOfRadius,
      checkinOverrideReason: meta.overrideReason||'', isNewStore: !!meta.isNewStore,
      checkoutTime:null, checkoutLat:null, checkoutLng:null,
      status:'active', orders:[], payment:0, notes:''
    };
    upsertVisit(newVisit).then(function(){ return refreshVisitsSilent(); }).then(function(){
      setState({checkinStage:'idle', outOfRadius:null, busy:false});
    }).catch(function(e){
      setState({busy:false, gpsError:'Gagal menyimpan check-in: '+(e&&e.message?e.message:'terjadi kesalahan')+'. Coba lagi.'});
    });
  }
  // Re-cek ke server (bukan S.visits lokal yang mungkin sudah basi) tepat sebelum menyimpan --
  // mencegah kunjungan aktif dobel kalau sales sempat menekan Check-in dua kali (mis. GPS lambat
  // ~30 detik lalu dicoba ulang) sebelum layar sempat menampilkan kunjungan aktif yang pertama.
  loadVisits().then(function(freshVisits){
    var already = freshVisits.some(function(v){ return v.salesName===S.session.name && v.status==='active'; });
    if(already){
      S.visits = freshVisits;
      setState({checkinStage:'idle', outOfRadius:null, busy:false});
      showToast('Anda sudah punya kunjungan aktif. Selesaikan dulu sebelum check-in baru.', true);
      return;
    }
    saveNewCheckin();
  }).catch(function(){
    // Gagal cek status terbaru (mis. jaringan bermasalah) -- jangan blokir check-in sama sekali,
    // lanjutkan seperti semula supaya sales tidak macet total gara-gara satu pengecekan gagal.
    saveNewCheckin();
  });
}

function finishCheckout(active, pos, orders, payment, notes, mismatchReason){
  try {
    var checkoutTime = new Date();
    var durationMinutes = (checkoutTime - new Date(active.checkinTime))/60000;
    var hasPhoto = payment > 0 && S.paymentPhoto && S.paymentPhoto.status==='ready';
    if(hasPhoto && mismatchReason == null){
      var mismatch = evaluatePhotoMismatch(S.paymentPhoto, pos, checkoutTime);
      if(mismatch){
        setState({busy:false, pendingCheckout:{active:active, pos:pos, orders:orders, payment:payment, notes:notes}, photoMismatchInfo:mismatch});
        return;
      }
    }
    var uploadStep = hasPhoto ? uploadPaymentPhoto(active.id, S.paymentPhoto.dataUrl) : Promise.resolve(null);
    uploadStep.then(function(uploadResult){
      var updatedVisit = Object.assign({}, active, {checkoutTime:checkoutTime.toISOString(), checkoutLat:pos.lat||null, checkoutLng:pos.lng||null, status:'done', durationMinutes:durationMinutes, orders:orders, payment:payment, notes:notes});
      if(hasPhoto){
        updatedVisit.paymentPhotoUrl = uploadResult && uploadResult.url ? uploadResult.url : null;
        updatedVisit.paymentPhotoTime = S.paymentPhoto.photoTime;
        updatedVisit.paymentPhotoLat = S.paymentPhoto.lat;
        updatedVisit.paymentPhotoLng = S.paymentPhoto.lng;
        updatedVisit.paymentPhotoLocationSource = S.paymentPhoto.locationSource;
        updatedVisit.paymentPhotoMismatch = !!mismatchReason;
        updatedVisit.paymentPhotoMismatchReason = mismatchReason || '';
      }
      return upsertVisit(updatedVisit);
    }).then(function(){ return refreshVisitsSilent(); })
      .then(function(){
        setState({busy:false, orderFormOpen:false, orderPaymentDraft:'', orderNotesDraft:'', paymentPhoto:null, pendingCheckout:null, photoMismatchInfo:null});
        showToast('Kunjungan tersimpan.');
        // Reload halaman: GPS berikutnya (check-in toko selanjutnya) kadang lebih presisi setelah reload penuh.
        setTimeout(function(){ location.reload(); }, 300);
      })
      .catch(function(e){ setState({busy:false}); alertSaveError(e); });
  } catch(e){
    console.error('finishCheckout gagal', e);
    setState({busy:false});
    alertSaveError(e);
  }
}

function refreshVisitsSilent(){
  return loadVisits().then(function(v){ S.visits=v; }).catch(function(e){ console.error('gagal muat kunjungan', e); });
}

/* Safety net: report any error that reaches here uncaught (e.g. an exception thrown inside an
   async callback like img.onload/canvas.toBlob, which no local .catch() can ever see) so it's
   still visible server-side instead of silently hanging the UI with zero diagnostic trail. */
window.addEventListener('error', function(ev){
  reportClientError('window.onerror', ev.error || new Error(ev.message));
});
window.addEventListener('unhandledrejection', function(ev){
  reportClientError('unhandledrejection', ev.reason);
});

/* ---------------- event delegation ---------------- */
document.getElementById('app').addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.getAttribute('data-action');
  if(Actions[action]) Actions[action](el);
});
document.getElementById('app').addEventListener('change', function(e){
  var el = e.target.closest('[data-daterange-prefix]');
  if(el) Actions.setDateRange(el);
  if(e.target.id === 'importUserFile'){
    var file = e.target.files && e.target.files[0];
    if(file) showToast('Memproses file "'+file.name+'"...', false);
    handleImportUsersFile(file);
    e.target.value = '';
  }
  if(e.target.id === 'orderPaymentPhoto'){
    var photoFile = e.target.files && e.target.files[0];
    e.target.value = '';
    if(photoFile) Actions.selectPaymentPhoto(photoFile);
  }
});
document.getElementById('app').addEventListener('input', function(e){
  if(e.target.id === 'storeNameInput') renderStoreSuggestions(e.target.value);
  if(e.target.id === 'storeSearchInput') filterStoreCards(e.target.value);
});
document.getElementById('app').addEventListener('focusin', function(e){
  if(e.target.id === 'storeNameInput') renderStoreSuggestions(e.target.value);
});

/* ---------------- app bootstrap ---------------- */
var SESSION_KEY = 'sft-session-v1';
function saveSessionLocal(session){
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch(e){ console.warn('gagal simpan sesi lokal', e); }
}
function loadSessionLocal(){
  try {
    var raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}
function clearSessionLocal(){
  try { localStorage.removeItem(SESSION_KEY); } catch(e){}
}

function initAuth(){
  setState({screen:'loading', errorMsg:''});
  loadUsers().then(function(users){
    S.users = users;
    if(Object.keys(users).length===0){ setState({screen:'setup', errorMsg:''}); return; }
    var saved = loadSessionLocal();
    if(saved && saved.username && users[saved.username] && users[saved.username].active){
      var u = users[saved.username];
      enterApp({role:u.role, name:u.displayName, username:u.username});
      return;
    }
    if(saved) clearSessionLocal(); // stale/invalid session (account removed or deactivated)
    setState({screen:'login', errorMsg:''});
  }).catch(function(e){
    setState({screen:'autherror', errorMsg: (e && e.message) ? e.message : 'Gagal memuat data. Periksa koneksi internet Anda.'});
  });
}

function enterApp(session){
  saveSessionLocal(session);
  setState({session:session, busy:false, errorMsg:'', screen: session.role==='sales' ? 'sales' : 'dashboard'});
  refreshVisitsSilent().then(function(){ render(); });
  if(session.role!=='sales'){ loadStores().then(function(stores){ S.storesCache=stores; render(); }); }
  var poll = setInterval(function(){
    if(!S.session){ clearInterval(poll); return; }
    refreshVisitsSilent().then(function(){
      if(S.dashTab==='users' || S.dashTab==='stores') return; // avoid disrupting file pickers / forms on these tabs
      if(S.checkinStage==='entering' || S.checkinStage==='outOfRadius') return; // avoid wiping the check-in form while typing
      if(S.orderFormOpen) return; // avoid wiping the checkout/order form while filling it in
      if(S.editingVisit) return; // avoid wiping the edit-visit form while filling it in
      if(S.manualEntryOpen) return; // avoid wiping the manual entry form while filling it in
      render();
    });
  }, 8000);
}

window.addEventListener('error', function(e){
  console.error('Global error:', e.error || e.message);
  showToast('⚠ Error: ' + (e.message || 'terjadi kesalahan') + ' (baris ' + (e.lineno||'?') + ')', true);
});
window.addEventListener('unhandledrejection', function(e){
  console.error('Unhandled rejection:', e.reason);
  showToast('⚠ Error (promise): ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)), true);
});

initAuth();
})();
